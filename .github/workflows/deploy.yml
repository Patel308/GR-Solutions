name: Build, Push, Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: grsolution-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_IMAGE: pateldeepesh/tv-wale
  NEXT_PUBLIC_SITE_URL: https://grsolution.co.in
  NEXT_PUBLIC_GA_MEASUREMENT_ID: G-0RQ8C75FPT

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build check
        run: npm run build

  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ env.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max
          provenance: false

  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Deploy the exact Docker Hub image
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/site_deploy
          chmod 600 ~/.ssh/known_hosts ~/.ssh/site_deploy
          trap 'rm -f ~/.ssh/site_deploy' EXIT
          printf '%s\n' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" "$IMAGE_DIGEST" |
            ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -i ~/.ssh/site_deploy deploy@187.127.146.219

      - name: Verify the Hostinger origin
        run: |
          set -euo pipefail
          ORIGIN=187.127.146.219
          DOMAIN=grsolution.co.in
          curl -fsS --max-time 20 --resolve "$DOMAIN:443:$ORIGIN" "https://$DOMAIN/api/health" > /dev/null
          HTML=$(curl -fsS --max-time 20 --resolve "$DOMAIN:443:$ORIGIN" "https://$DOMAIN/")
          CHUNK=$(printf '%s' "$HTML" | grep -o '"/_next/static/chunks/[^"]*\.js"' | head -1 | tr -d '"' || true)
          [[ -n "$CHUNK" ]]
          curl -fsS --max-time 20 --resolve "$DOMAIN:443:$ORIGIN" "https://$DOMAIN$CHUNK" > /dev/null
          echo "Hostinger origin and static asset passed"
